project:
  type: website
  output-dir: docs
  resources:
    - downloads/*

website:
  title: "BIO 5100"
  site-url: https://claisselab.github.io/BIO_5100
  back-to-top-navigation: true

  # Provides links to the source files beside the table of contents
  repo-url: https://github.com/ClaisseLab/BIO_5100
  repo-actions: [source]

  navbar:
    background: primary
    pinned: true
    search: true

    left:
      - text: "Resources"
        href: index.qmd
      - text: "Online Books"
        href: Online_Books.qmd
      - text: "Example Code"
        href: Example_Code.qmd
      - text: "BIO 5150L"
        href: BIO_5150L.qmd
      - text: "BIO 5800L"
        href: https://claisselab.github.io/BIO_5800L/

    tools:
      - icon: house-fill
        href: https://claisselab.com
        aria-label: "Claisse Lab website"
      - icon: github
        href: https://github.com/ClaisseLab/BIO_5100
        aria-label: "BIO 5100 GitHub repository"

  page-footer:
    left: "Claisse BIO Course Resources"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    respect-user-color-scheme: true
    css: styles.css
    toc: true
    smooth-scroll: true
    link-external-icon: true
    link-external-newwindow: true

editor: visual